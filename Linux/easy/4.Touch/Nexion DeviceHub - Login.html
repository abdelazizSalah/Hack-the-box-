<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>Nexion DeviceHub - Login</title>
    <link
      rel="icon"
      href="http://htb.touch:8443/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="stylesheet"
      href="Nexion%20DeviceHub%20-%20Login_files/style.css"
    />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-box {
        width: 380px;
        background: #161a23;
        border: 1px solid #2a2e38;
        border-radius: 12px;
        padding: 40px;
      }
      .login-logo {
        width: 48px;
        height: 48px;
        background: #2563eb;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 24px;
        color: #fff;
        margin: 0 auto 20px;
      }
      .login-title {
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        color: #e0e0e0;
        margin-bottom: 4px;
      }
      .login-sub {
        text-align: center;
        font-size: 12px;
        color: #666;
        margin-bottom: 28px;
      }
      .login-input {
        width: 100%;
        padding: 12px 14px;
        background: #0f1117;
        border: 1px solid #2a2e38;
        border-radius: 6px;
        color: #e0e0e0;
        font-size: 14px;
        margin-bottom: 16px;
      }
      .login-input:focus {
        border-color: #2563eb;
        outline: none;
      }
      .login-input::placeholder {
        color: #555;
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .login-btn:hover {
        background: #1d4ed8;
      }
      .login-error {
        background: #3b1c1c;
        border: 1px solid #7f1d1d;
        color: #f87171;
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 16px;
        text-align: center;
      }
      .login-hint {
        text-align: center;
        font-size: 11px;
        color: #444;
        margin-top: 20px;
        cursor: help;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="login-logo">
        <svg
          viewBox="0 0 36 36"
          width="28"
          height="28"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect
            x="2"
            y="4"
            width="32"
            height="28"
            rx="3"
            stroke="#fff"
            stroke-width="2.5"
          ></rect>
          <path
            d="M8 14h20M8 20h20M8 26h12"
            stroke="#60a5fa"
            stroke-width="2"
            stroke-linecap="round"
          ></path>
          <rect
            x="10"
            y="1"
            width="16"
            height="6"
            rx="2"
            fill="#2563eb"
            stroke="#fff"
            stroke-width="1.5"
          ></rect>
          <circle cx="18" cy="4" r="1.5" fill="#fff"></circle>
        </svg>
      </div>
      <div class="login-title">Nexion DocReader</div>
      <div class="login-sub">DeviceHub DH-100 — Gate B7</div>
      <div class="login-error">Invalid password</div>
      <form method="POST" action="/login">
        <input
          type="password"
          name="password"
          class="login-input"
          placeholder="Device password"
          autofocus=""
          required=""
        /><button type="submit" class="login-btn">Sign In</button>
      </form>
      <div
        style="
          margin-top: 16px;
          padding-top: 16px;
          border-top: 1px solid #2a2e38;
          text-align: center;
        "
      >
        <div
          style="
            font-size: 10px;
            color: #555;
            letter-spacing: 1px;
            margin-bottom: 10px;
          "
        >
          STAFF ACCESS
        </div>
        <button
          onclick="scanBadge()"
          id="badgeBtn"
          style="
            width: 100%;
            padding: 10px;
            background: #1a1e28;
            color: #888;
            border: 1px solid #2a2e38;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: monospace;
          "
          disabled="disabled"
        >
          Scanning...
        </button>
        <div
          id="badgeStatus"
          style="font-size: 11px; color: rgb(14, 165, 233); margin-top: 8px"
        >
          Place badge on scanner...
        </div>
      </div>
      <div
        class="login-hint"
        title="The default password is the device serial number included in your DeviceHub packaging."
      >
        Forgot your password?
      </div>
    </div>
    <script>
      function scanBadge() {
        var btn = document.getElementById("badgeBtn");
        var st = document.getElementById("badgeStatus");
        btn.disabled = true;
        btn.textContent = "Scanning...";
        st.textContent = "Place badge on scanner...";
        st.style.color = "#0ea5e9";
        fetch("/login/badge", { method: "POST" })
          .then((r) => r.json())
          .then((d) => {
            if (d.success) {
              st.textContent = "Badge verified: " + d.name;
              st.style.color = "#4ade80";
              setTimeout(() => (window.location.href = d.redirect), 1000);
            } else {
              st.textContent = d.error || "Badge scan failed";
              st.style.color = "#f87171";
              btn.disabled = false;
              btn.textContent = "Scan Staff Badge";
            }
          })
          .catch(() => {
            st.textContent = "Scanner unavailable";
            st.style.color = "#f87171";
            btn.disabled = false;
            btn.textContent = "Scan Staff Badge";
          });
      }
    </script>
  </body>
</html>
